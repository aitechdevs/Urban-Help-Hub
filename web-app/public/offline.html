<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082f5b">
  <title>UrbanHelpHub — Offline</title>
  <style>
    body{margin:0;padding:24px;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#082f5b}
    main{max-width:440px;margin:15vh auto;text-align:center}
    img{max-width:260px;width:100%;height:auto}
    p{line-height:1.6;color:#475569}
    a{display:inline-block;padding:12px 24px;border-radius:12px;background:#2fad45;color:white;font-weight:bold;text-decoration:none;cursor:pointer}
    a:hover{filter:brightness(.95)}a:active{filter:brightness(.9)}a:focus-visible{outline:3px solid #082f5b;outline-offset:4px}
  </style>
</head>
<body><main>
  <h1>UrbanHelpHub</h1>
  <h2>You’re offline</h2>
  <p>Reconnect to view tasks, messages and account information. No private account data is stored for offline use.</p>
  <a href="/">Try again</a>
</main></body>
</html>
